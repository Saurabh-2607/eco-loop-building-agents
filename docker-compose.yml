services:
  caddy:
    image: caddy:2.8-alpine
    container_name: ecoloop-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - ecoloop-network

  frontend:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/frontend/Dockerfile
    container_name: ecoloop-frontend
    expose:
      - "3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.production
    networks:
      - ecoloop-network

  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../infrastructure/docker/backend/Dockerfile
    container_name: ecoloop-backend
    expose:
      - "8000"
    volumes:
      - ./apps/backend:/app
      - ./logs:/app/logs
      - energyplus-output:/app/output
    env_file:
      - .env.production
    depends_on:
      - redis
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecoloop-network

  redis:
    image: redis:7-alpine
    container_name: ecoloop-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - ecoloop-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ecoloop-ollama
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - ecoloop-network

networks:
  ecoloop-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  redis-data:
  ollama-models:
  energyplus-output:
