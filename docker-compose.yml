version: "3.9"

services:
  frontend:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/frontend/Dockerfile
    container_name: ecoloop-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.development
    networks:
      - ecoloop-network

  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../infrastructure/docker/backend/Dockerfile
    container_name: ecoloop-backend
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
    env_file:
      - .env.development
    depends_on:
      - postgres
      - redis
    networks:
      - ecoloop-network

  postgres:
    image: postgres:16-alpine
    container_name: ecoloop-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env.development
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecoloop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecoloop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecoloop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ecoloop-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ecoloop-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
